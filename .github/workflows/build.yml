name: Build

on:
  push:
  workflow_dispatch:

jobs:
  generate-pdf:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-fonts-recommended texlive-fonts-extra texlive-latex-extra texlive-lang-portuguese

      - name: Build Portuguese Resume
        working-directory: resumes/pt-br
        run: pdflatex -interaction=nonstopmode -halt-on-error curriculo.tex

      - name: Upload generated PDF to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: curriculo
          path: resumes/pt-br/curriculo.pdf
